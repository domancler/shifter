
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /shifter {
        return 301 /shifter/;
    }

    location /shifter/ {
        rewrite ^/shifter/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
